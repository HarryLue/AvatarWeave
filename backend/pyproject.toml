[project]
name = "avatarweave-agent"
version = "0.1.0"
description = "Standalone LiveKit avatar agent and token API"
requires-python = ">=3.11,<3.14"
dependencies = [
  "livekit-agents[openai,silero]~=1.8",
  "livekit-api>=1.0,<2",
  "fastapi>=0.124,<1",
  "uvicorn>=0.38,<1",
  "sqlalchemy[asyncio]>=2.0.46,<2.1",
  "aiosqlite>=0.21,<1",
  "asyncpg>=0.31,<1",
  "pydantic-settings>=2.12,<3",
  "python-dotenv>=1.1,<2",
  "pyyaml>=6,<7",
  "websockets>=14,<16",
  "kokoro-onnx==0.6.1",
  "misaki[zh]>=0.9.4,<0.10",
]
[project.optional-dependencies]
google = ["livekit-plugins-google~=1.8"]
cartesia = ["livekit-plugins-cartesia~=1.8"]
deepgram = ["livekit-plugins-deepgram~=1.8"]
elevenlabs = ["livekit-plugins-elevenlabs~=1.8"]
zhiai = ["tritonclient[grpc]>=2.67,<3", "scipy>=1.15,<2", "soundfile>=0.13,<1", "requests>=2.32,<3"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "httpx>=0.28", "ruff>=0.14"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
[tool.ruff]
line-length = 100
