name: kokoro-runtime
on:
  workflow_dispatch:
    inputs:
      device:
        description: CPU runner or a preconfigured self-hosted NVIDIA runner
        required: true
        type: choice
        options: [cpu, gpu]
        default: cpu
permissions:
  contents: read
jobs:
  inference:
    runs-on: ${{ inputs.device == 'gpu' && fromJSON('["self-hosted","linux","gpu"]') || fromJSON('["ubuntu-latest"]') }}
    env:
      PIPELINE_MODE: mock
      KOKORO_DEVICE: ${{ inputs.device }}
      KOKORO_PRECISION: fp32
      KOKORO_GPU_ID: '0'
      KOKORO_CUDA_LIB_DIR: ${{ vars.KOKORO_CUDA_LIB_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.19'
      - run: uv sync --locked --project backend
      - run: backend/.venv/bin/python scripts/download-kokoro.py
      - if: inputs.device == 'gpu'
        run: uv sync --locked --project backend/kokoro-runtime-gpu
      - name: Exercise real inference without cloud credentials
        run: |
          if [ "$KOKORO_DEVICE" = gpu ]; then
            backend/kokoro-runtime-gpu/.venv/bin/python scripts/kokoro-smoke.py
          else
            backend/.venv/bin/python scripts/kokoro-smoke.py
          fi
