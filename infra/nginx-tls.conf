# Rendered by scripts/configure-https.py using infra/https.json.
# HTTP remains available in the main site configuration.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name __TLS_NAMES__;
    ssl_certificate __TLS_CERT__;
    ssl_certificate_key __TLS_KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/avatarweave-routes.conf;
}
