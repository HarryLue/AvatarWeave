# Shared HTTP/HTTPS routes, installed under /etc/nginx/snippets/.
root /var/www/avatarweave;
index index.html;
client_max_body_size 20m;

proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

location ^~ /.well-known/acme-challenge/ {
    root /var/lib/avatarweave-acme;
    default_type text/plain;
    try_files $uri =404;
}

location /api/ {
    # Overwrite any client-supplied value; the API uses this browser-facing URL.
    proxy_set_header X-AvatarWeave-RTC-URL "$avatarweave_websocket_scheme://$http_host/realtime";
    proxy_pass http://127.0.0.1:8090;
    proxy_buffering off;
    proxy_read_timeout 3600s;
}

location = /docs {
    proxy_pass http://127.0.0.1:8090;
}

location = /openapi.json {
    proxy_pass http://127.0.0.1:8090;
}

location = /realtime {
    return 308 /realtime/;
}

location /realtime/ {
    # Strip the /realtime/ prefix before forwarding /rtc, /rtc/validate, etc.
    proxy_pass http://127.0.0.1:17880/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $avatarweave_connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location /assets/ {
    try_files $uri =404;
}

location = /speaking {
    return 308 /speaking/;
}

location ^~ /speaking/assets/ {
    try_files $uri =404;
}

location ^~ /speaking/avatar-assets/ {
    try_files $uri =404;
}

location /speaking/ {
    try_files $uri $uri/ /speaking/index.html;
}

location / {
    try_files $uri $uri/ /index.html;
}
