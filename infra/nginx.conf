# Installed as /etc/nginx/conf.d/avatarweave.conf by scripts/deploy.sh install.
# HTTPS is automatically installed alongside HTTP from infra/https.json.
# Included inside the distribution nginx.conf's http block.
map $http_upgrade $avatarweave_connection_upgrade {
    default upgrade;
    ''      close;
}

map $scheme $avatarweave_websocket_scheme {
    default ws;
    https   wss;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    # HTTP stays available for IP/domain access and ACME validation.
    server_name _;
    include /etc/nginx/snippets/avatarweave-routes.conf;
}
